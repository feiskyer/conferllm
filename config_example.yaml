# ConferLLM Configuration File
# =========================
#
# This is a comprehensive example configuration for ConferLLM.
# Copy this file to ~/.conferllm/config.yaml and customize it for your needs.
#
# IMPORTANT SECURITY NOTES:
# - Replace ALL placeholder API keys with your actual keys
# - Set directory permissions: chmod 700 ~/.conferllm
# - Set file permissions: chmod 600 ~/.conferllm/config.yaml
# - NEVER commit this file to version control
# - Use environment variables or secret management for production

# Global System Prompt (Optional)
# --------------------------------
# This system prompt will be applied to ALL models unless overridden by a model-specific prompt.
# Useful for setting consistent behavior across all AI interactions.
# Removal tip: Comment out or delete this line to disable global system prompts.
global_system_prompt: "You are a helpful AI assistant. Be concise and accurate in your responses."

# Image Safety Limits (Optional)
# ------------------------------
# These bound newly attached images before any provider request. A model's
# max_input_images also includes images replayed from earlier turns.
image_limits:
  max_count: 16
  max_bytes_per_image: 20971520  # 20 MiB
  max_total_bytes: 52428800  # 50 MiB

# Model Configuration
# -------------------
# Each entry in model_list defines a model you can use with ConferLLM
# The model_name is what you'll use in CLI and MCP calls
# (e.g., chat(message="Hello", model="gpt-6-astra"))
# The litellm_params configure the actual provider connection
# Optional: Add system_prompt field to override global system prompt for specific models

model_list:
  # ============================================================================
  # OPENAI MODELS (GPT-6 Astra & Reasoning Series)
  # ============================================================================

  - model_name: gpt-6-astra  # Frontier multimodal model (requires Responses API)
    api_format: responses  # Responses API (default for OpenAI)
    system_prompt: "You are GPT-6 Astra, an advanced AI system with multimodal and deep tool reasoning capabilities."
    capabilities:
      input_modalities: [text, image]
      output_modalities: [text]
      max_input_images: 16
    litellm_params:
      model: openai/gpt-6-astra
      api_key: "sk-your-openai-api-key-here"
      max_tokens: 128000

  # ============================================================================
  # ANTHROPIC MODELS (Claude Series)
  # ============================================================================

  - model_name: claude-opus-5  # Anthropic's flagship model
    system_prompt: "You are Claude Opus 5, an AI assistant created by Anthropic. You excel at coding, architecture, deep reasoning, and multimodal analysis."
    capabilities:
      input_modalities: [text, image]
      output_modalities: [text]
      max_input_images: 16
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: "sk-ant-your-anthropic-api-key-here"
      max_tokens: 128000

  # ============================================================================
  # DEEPSEEK MODELS
  # ============================================================================

  - model_name: DeepSeek-V4.1-Flash
    capabilities:
      input_modalities: [text, image]
      output_modalities: [text]
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: "sk-your-deepseek-api-key-here"
      max_tokens: 128000

  # ============================================================================
  # GOOGLE GEMINI MODELS
  # ============================================================================

  - model_name: gemini-3.8-flash
    capabilities:
      input_modalities: [text, image]
      output_modalities: [text]
      max_input_images: 16
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: "your-gemini-api-key"
      max_tokens: 65536

  # ============================================================================
  # LOCAL LLM SERVERS (Ollama, vLLM, LM Studio)
  # ============================================================================

  - model_name: local-llama4  # Meta Llama 4 via Ollama
    litellm_params:
      model: ollama_chat/llama4
      api_base: "http://localhost:11434"

  - model_name: local-qwen3  # Qwen 3 Coder via Ollama
    capabilities:
      input_modalities: [text]
      output_modalities: [text]
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: "http://localhost:11434"

